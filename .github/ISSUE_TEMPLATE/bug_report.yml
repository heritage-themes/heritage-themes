name: Bug report
description: A colour, contrast or readability problem in a theme, or a fault in the plugin, extension or package.
labels: [bug]
body:
  - type: input
    id: theme
    attributes:
      label: Theme
      description: The full theme name, as shown in the IDE's theme list.
      placeholder: Wuxing Night
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - JetBrains IDE
        - VS Code
        - Other VS Code-compatible editor
        - Visual Studio
        - Sublime Text
        - Zed
        - Neovim
        - Notepad++
        - Xcode
        - Helix
        - Kakoune
        - Micro
        - Vim
        - GNU Emacs
        - Nano
        - Textadept
        - Lapce
        - Qt Creator
        - Amp
        - Eclipse
        - Nova
        - JupyterLab
        - Terminal emulator, shell, prompt or multiplexer
    validations:
      required: true
  - type: input
    id: editor-version
    attributes:
      label: Editor name and version
      description: For example IntelliJ IDEA 2025.3.1, PyCharm 2025.3, VS Code 1.105, Visual Studio 2026 18.11, Sublime Text 4200, Zed 1.25, Neovim 0.12, Notepad++ 8.9.8, Xcode 27.1, Helix 25.07, Kakoune 2026.04.12, Micro 2.0.15, Vim 9.2, Emacs 30.2, Qt Creator 20.0, Eclipse 2026-09, JupyterLab 4.6, kitty 0.48 with fish 4.6 or tmux 3.8.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin or extension version
      description: Shown in Settings | Plugins, in the Extensions view, in Visual Studio under Extensions | Manage Extensions, for Neovim in your plugin manager or the tag you installed, for JupyterLab in the output of pip show jupyterlab-heritage-themes, or for Notepad++, Xcode, Helix, Kakoune, Micro, Vim and Emacs in the name of the release zip.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language or file type
      description: Leave empty if the problem is in the user interface.
      placeholder: TypeScript, SQL, YAML
  - type: textarea
    id: actual
    attributes:
      label: What looks wrong
      description: Name the element, such as a keyword, a tab or a popup, and say what is wrong with it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here. Include a code sample when the problem is in the editor.
    validations:
      required: true
