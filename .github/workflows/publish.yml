      - name: Collect the wheel
        run: mkdir pypi && cp build/pygments/*.whl pypi/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi
          # A re-run of a failed release must not fail on the version that this job already uploaded.
          skip-existing: true

      - uses: actions/upload-artifact@v7
        with:
          name: pygments
          path: build/heritage-themes-pygments-${{ env.VERSION }}.zip
          if-no-files-found: error

  release:
    needs: [check, jetbrains, vscode, visualstudio, sublime, zed, nvim, notepadpp, xcode, helix, kakoune, micro, vim,
            emacs, terminals, nano, textadept, lapce, qtcreator,
            amp, eclipse, nova, jupyterlab, pygments]
    # Runs once each product has either published or been left out of the release.
    if: >-
      ${{ !cancelled() && needs.check.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.jetbrains.result)
      && contains(fromJSON('["success", "skipped"]'), needs.vscode.result)
      && contains(fromJSON('["success", "skipped"]'), needs.visualstudio.result)
      && contains(fromJSON('["success", "skipped"]'), needs.sublime.result)
      && contains(fromJSON('["success", "skipped"]'), needs.zed.result)
      && contains(fromJSON('["success", "skipped"]'), needs.nvim.result)
      && contains(fromJSON('["success", "skipped"]'), needs.notepadpp.result)
      && contains(fromJSON('["success", "skipped"]'), needs.xcode.result)
      && contains(fromJSON('["success", "skipped"]'), needs.helix.result)
      && contains(fromJSON('["success", "skipped"]'), needs.kakoune.result)
      && contains(fromJSON('["success", "skipped"]'), needs.micro.result)
      && contains(fromJSON('["success", "skipped"]'), needs.vim.result)
      && contains(fromJSON('["success", "skipped"]'), needs.emacs.result)
      && contains(fromJSON('["success", "skipped"]'), needs.terminals.result)
      && contains(fromJSON('["success", "skipped"]'), needs.nano.result)
      && contains(fromJSON('["success", "skipped"]'), needs.textadept.result)
      && contains(fromJSON('["success", "skipped"]'), needs.lapce.result)
      && contains(fromJSON('["success", "skipped"]'), needs.qtcreator.result)
      && contains(fromJSON('["success", "skipped"]'), needs.amp.result)
      && contains(fromJSON('["success", "skipped"]'), needs.eclipse.result)
      && contains(fromJSON('["success", "skipped"]'), needs.nova.result)
      && contains(fromJSON('["success", "skipped"]'), needs.jupyterlab.result)
      && contains(fromJSON('["success", "skipped"]'), needs.pygments.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      JETBRAINS: ${{ needs.check.outputs.jetbrains }}
      VSCODE: ${{ needs.check.outputs.vscode }}
      VISUALSTUDIO: ${{ needs.check.outputs.visualstudio }}
      SUBLIME: ${{ needs.check.outputs.sublime }}
      ZED: ${{ needs.check.outputs.zed }}
      NVIM: ${{ needs.check.outputs.nvim }}
      NOTEPADPP: ${{ needs.check.outputs.notepadpp }}
      XCODE: ${{ needs.check.outputs.xcode }}
      HELIX: ${{ needs.check.outputs.helix }}
      KAKOUNE: ${{ needs.check.outputs.kakoune }}
      MICRO: ${{ needs.check.outputs.micro }}
      VIM: ${{ needs.check.outputs.vim }}
      EMACS: ${{ needs.check.outputs.emacs }}
      TERMINALS: ${{ needs.check.outputs.terminals }}
      NANO: ${{ needs.check.outputs.nano }}
      TEXTADEPT: ${{ needs.check.outputs.textadept }}
      LAPCE: ${{ needs.check.outputs.lapce }}
      QTCREATOR: ${{ needs.check.outputs.qtcreator }}
      AMP: ${{ needs.check.outputs.amp }}
      ECLIPSE: ${{ needs.check.outputs.eclipse }}
      NOVA: ${{ needs.check.outputs.nova }}
      JUPYTERLAB: ${{ needs.check.outputs.jupyterlab }}
      PYGMENTS: ${{ needs.check.outputs.pygments }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prints the changelog section for a version.
          section() {
            awk -v v="$2" '
              $0 ~ "^## \\[" v "\\]" {on = 1; next}
              /^## \[/ {on = 0}
              on' "$1"
          }
          # Downloads the files matching the patterns from the newest release that carries the
          # first one, so a product left out of this release ships the build of its last release.
          attach() {
            local tags
            tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(any(.assets[]; .name == \"$1\")) | .tag_name")
            if [ -z "$tags" ]; then
              echo "::error::No GitHub release carries $1"
              exit 1
            fi
            local pattern patterns=()
            for pattern in "$@"; do patterns+=(--pattern "$pattern"); done
            gh release download "${tags%%$'\n'*}" --repo "$GITHUB_REPOSITORY" "${patterns[@]}" --dir dist
          }
          # Sorts a product into the release notes: its changelog section when it is in this release, otherwise a line
          # in the list of unchanged products, with its last build attached.
          changed="$RUNNER_TEMP/changed.md"; unchanged="$RUNNER_TEMP/unchanged.md"; titles="$RUNNER_TEMP/titles.txt"
          : > "$changed"; : > "$unchanged"; : > "$titles"
          notes() {
            local title=$1 included=$2 changelog=$3 file=$4
            shift 4
            if [ "$included" = true ]; then
              { echo "## $title"; section "$changelog" "$VERSION"; } >> "$changed"
              echo "$title" >> "$titles"
            else
              local previous
              previous=$(sed -n '/^## \[[0-9]/{s/^## \[\([^]]*\)\].*/\1/p;q}' "$changelog")
              echo "- $title $previous" >> "$unchanged"
              attach "${file/<version>/$previous}" "$@" >&2
            fi
          }
          notes "JetBrains plugin" "$JETBRAINS" CHANGELOG.md "heritage-themes-<version>-signed.zip" '*.icls'
          notes "VS Code extension" "$VSCODE" vscode/CHANGELOG.md "heritage-themes-vscode-<version>.vsix"
          notes "Visual Studio extension" "$VISUALSTUDIO" visualstudio/CHANGELOG.md \
            "heritage-themes-visualstudio-<version>.vsix"
          notes "Sublime Text package" "$SUBLIME" sublime/CHANGELOG.md "heritage-themes-sublime-<version>.sublime-package"
          notes "Zed extension" "$ZED" zed/CHANGELOG.md "heritage-themes-zed-<version>.zip"
          notes "Neovim plugin" "$NVIM" nvim/CHANGELOG.md "heritage-themes-nvim-<version>.zip"
          notes "Notepad++ themes" "$NOTEPADPP" notepadpp/CHANGELOG.md "heritage-themes-notepadpp-<version>.zip"
          notes "Xcode themes" "$XCODE" xcode/CHANGELOG.md "heritage-themes-xcode-<version>.zip"
          notes "Helix themes" "$HELIX" helix/CHANGELOG.md "heritage-themes-helix-<version>.zip"
          notes "Kakoune colour schemes" "$KAKOUNE" kakoune/CHANGELOG.md "heritage-themes-kakoune-<version>.zip"
          notes "Micro colour schemes" "$MICRO" micro/CHANGELOG.md "heritage-themes-micro-<version>.zip"
          notes "Vim colour schemes" "$VIM" vim/CHANGELOG.md "heritage-themes-vim-<version>.zip"
          notes "Emacs themes" "$EMACS" emacs/CHANGELOG.md "heritage-themes-emacs-<version>.zip"
          notes "Terminals themes" "$TERMINALS" terminals/CHANGELOG.md "heritage-themes-terminals-<version>.zip"
          notes "Nano colour schemes" "$NANO" nano/CHANGELOG.md "heritage-themes-nano-<version>.zip"
          notes "Textadept themes" "$TEXTADEPT" textadept/CHANGELOG.md "heritage-themes-textadept-<version>.zip"
          notes "Lapce themes" "$LAPCE" lapce/CHANGELOG.md "heritage-themes-lapce-<version>.zip"
          notes "Qt Creator themes" "$QTCREATOR" qtcreator/CHANGELOG.md "heritage-themes-qtcreator-<version>.zip"
          notes "Amp themes" "$AMP" amp/CHANGELOG.md "heritage-themes-amp-<version>.zip"
          notes "Eclipse plugin" "$ECLIPSE" eclipse/CHANGELOG.md "heritage-themes-eclipse-<version>.zip"
          notes "Nova themes" "$NOVA" nova/CHANGELOG.md "heritage-themes-nova-<version>.zip"
          notes "JupyterLab themes" "$JUPYTERLAB" jupyterlab/CHANGELOG.md "heritage-themes-jupyterlab-<version>.zip"
          notes "Pygments styles" "$PYGMENTS" pygments/CHANGELOG.md "heritage-themes-pygments-<version>.zip"
          {
            echo "This release changes: $(paste -sd, "$titles" | sed 's/,/, /g')."
            echo "Every other product is unchanged: its file keeps the version of its last release, which its file name shows."
            echo
            cat "$changed"
            if [ -s "$unchanged" ]; then
              echo "## Unchanged products"
              echo
              echo "The attached builds are those of the versions listed."
              echo
              cat "$unchanged"
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*
