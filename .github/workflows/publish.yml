name: Publish

# Fires only when a version tag (for example `v1.0.0`) is pushed, so the tag push is the release
# gate. scripts/release.sh pushes the tag after Build has passed on the commit it points at.
# Publishes each product whose changelog has a section for the version, then creates one GitHub
# release that carries every product: a product left out keeps the build of its last release.
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      jetbrains: ${{ steps.check.outputs.jetbrains }}
      vscode: ${{ steps.check.outputs.vscode }}
      sublime: ${{ steps.check.outputs.sublime }}
      zed: ${{ steps.check.outputs.zed }}
      nvim: ${{ steps.check.outputs.nvim }}
      notepadpp: ${{ steps.check.outputs.notepadpp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        id: check
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' build.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in build.py"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on master"
            exit 1
          fi
          jetbrains=false vscode=false sublime=false zed=false nvim=false notepadpp=false
          grep -q "^## \[$version\]" CHANGELOG.md && jetbrains=true
          grep -q "^## \[$version\]" vscode/CHANGELOG.md && vscode=true
          grep -q "^## \[$version\]" sublime/CHANGELOG.md && sublime=true
          grep -q "^## \[$version\]" zed/CHANGELOG.md && zed=true
          grep -q "^## \[$version\]" nvim/CHANGELOG.md && nvim=true
          grep -q "^## \[$version\]" notepadpp/CHANGELOG.md && notepadpp=true
          if [ "$jetbrains" = false ] && [ "$vscode" = false ] && [ "$sublime" = false ] && [ "$zed" = false ] \
              && [ "$nvim" = false ] && [ "$notepadpp" = false ]; then
            echo "::error::No product changelog has a [$version] section"
            exit 1
          fi
          {
            echo "version=$version"
            echo "jetbrains=$jetbrains"
            echo "vscode=$vscode"
            echo "sublime=$sublime"
            echo "zed=$zed"
            echo "nvim=$nvim"
            echo "notepadpp=$notepadpp"
          } >> "$GITHUB_OUTPUT"

  jetbrains:
    needs: check
    if: needs.check.outputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # JetBrains marketplace-zip-signer CLI, pinned with the SHA-256 of the jar from Maven Central.
      SIGNER_VERSION: 0.1.43
      SIGNER_SHA256: 2958a0f42221d6062b50f22754e413ae5cc42f60c441467202c6700df2e22f44
      PLUGIN_XML_ID: heritage.themes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The signer exits successfully on an empty certificate or key and the upload would then
      # carry an unsigned archive. Fail before either runs.
      - name: Check release secrets
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          missing=0
          for name in CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD PUBLISH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"

      - run: python3 build.py

      - name: Sign the plugin
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          signer="$RUNNER_TEMP/marketplace-zip-signer-cli.jar"
          curl --fail --silent --show-error --location --output "$signer" \
            "https://repo1.maven.org/maven2/org/jetbrains/marketplace-zip-signer/$SIGNER_VERSION/marketplace-zip-signer-$SIGNER_VERSION-cli.jar"
          echo "$SIGNER_SHA256  $signer" | sha256sum --check -
          umask 077
          printf '%s\n' "$CERTIFICATE_CHAIN" > "$RUNNER_TEMP/chain.crt"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/private.pem"
          java -jar "$signer" sign \
            -in "build/heritage-themes-$VERSION.zip" \
            -out "build/heritage-themes-$VERSION-signed.zip" \
            -cert-file "$RUNNER_TEMP/chain.crt" \
            -key-file "$RUNNER_TEMP/private.pem" \
            -key-pass "$PRIVATE_KEY_PASSWORD"
          java -jar "$signer" verify \
            -in "build/heritage-themes-$VERSION-signed.zip" \
            -cert "$RUNNER_TEMP/chain.crt"
          rm -f "$RUNNER_TEMP/chain.crt" "$RUNNER_TEMP/private.pem"

      # Uploads a new version of a plugin that already exists on the Marketplace. The first
      # version is uploaded by hand (docs/releasing.md).
      - name: Publish to JetBrains Marketplace
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $PUBLISH_TOKEN" \
            --form "xmlId=$PLUGIN_XML_ID" \
            --form "file=@build/heritage-themes-$VERSION-signed.zip" \
            https://plugins.jetbrains.com/plugin/uploadPlugin

      - name: Collect the release files
        run: mkdir dist && cp "build/heritage-themes-$VERSION-signed.zip" build/schemes/*.icls dist/

      - uses: actions/upload-artifact@v7
        with:
          name: jetbrains
          path: dist/
          if-no-files-found: error

  vscode:
    needs: check
    if: needs.check.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    # The Entra ID federated credential trusts this environment (docs/releasing.md).
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write # sign in to Microsoft Entra ID and to Open VSX through trusted publishing
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check release settings
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"

      - run: python3 build.py --vsix

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the VS Marketplace
        run: scripts/vscode/node_modules/.bin/vsce publish --azure-credential --packagePath "build/heritage-themes-vscode-$VERSION.vsix"

      - name: Publish to Open VSX
        run: scripts/vscode/node_modules/.bin/ovsx publish --trusted-publishing "build/heritage-themes-vscode-$VERSION.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: vscode
          path: build/heritage-themes-vscode-${{ env.VERSION }}.vsix
          if-no-files-found: error

  sublime:
    needs: check
    if: needs.check.outputs.sublime == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # Package Control installs from this repository, which holds the package at its root (docs/releasing.md).
      SUBLIME_REPOSITORY: heritage-themes/heritage-themes-sublime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check release secrets
        shell: bash
        env:
          SUBLIME_REPO_TOKEN: ${{ secrets.SUBLIME_REPO_TOKEN }}
        run: |
          if [ -z "$SUBLIME_REPO_TOKEN" ]; then
            echo "::error::Repository secret SUBLIME_REPO_TOKEN is empty or not set"
            exit 1
          fi

      - run: python3 build.py

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SUBLIME_REPOSITORY }}
          token: ${{ secrets.SUBLIME_REPO_TOKEN }}
          path: sublime-repository
          fetch-depth: 0

      # Package Control reads the tag, which is the plain version: it needs a semantic version.
      - name: Publish to the Sublime Text package repository
        shell: bash
        run: |
          cd sublime-repository
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "$SUBLIME_REPOSITORY is already tagged $VERSION"
            exit 0
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../build/sublime/. .
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --message "Release $VERSION" \
              --message "Generated from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          fi
          git tag "$VERSION"
          git push origin HEAD "refs/tags/$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: sublime
          path: build/heritage-themes-sublime-${{ env.VERSION }}.sublime-package
          if-no-files-found: error

  zed:
    needs: check
    if: needs.check.outputs.zed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # Zed's extension registry installs from this repository, which holds the extension at its root
      # (docs/releasing.md).
      ZED_REPOSITORY: heritage-themes/heritage-themes-zed
      # The registry, and the fork that the pull request updating it comes from.
      ZED_REGISTRY: zed-industries/extensions
      ZED_REGISTRY_FORK: heritage-themes/extensions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check release secrets
        shell: bash
        env:
          ZED_REPO_TOKEN: ${{ secrets.ZED_REPO_TOKEN }}
          ZED_REGISTRY_TOKEN: ${{ secrets.ZED_REGISTRY_TOKEN }}
        run: |
          for name in ZED_REPO_TOKEN ZED_REGISTRY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is empty or not set"
              exit 1
            fi
          done

      - run: python3 build.py

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ZED_REPOSITORY }}
          token: ${{ secrets.ZED_REPO_TOKEN }}
          path: zed-repository
          fetch-depth: 0

      - name: Publish to the Zed extension repository
        id: repository
        shell: bash
        run: |
          cd zed-repository
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -r ../build/zed/. .
            git add --all
            if ! git diff --cached --quiet; then
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit --message "Release $VERSION" \
                --message "Generated from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            fi
            git tag "v$VERSION"
            git push origin HEAD "refs/tags/v$VERSION"
          fi
          echo "commit=$(git rev-parse "refs/tags/v$VERSION^{commit}")" >> "$GITHUB_OUTPUT"

      # The registry pins each extension as a submodule with its version in extensions.toml; a pull
      # request that moves both publishes the release once Zed's maintainers merge it.
      - name: Open the Zed extension registry pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ZED_REGISTRY_TOKEN }}
          COMMIT: ${{ steps.repository.outputs.commit }}
          ID: heritage-theme
        run: |
          branch="$ID-$VERSION"
          registered=$(gh api "repos/$ZED_REGISTRY/contents/extensions.toml" -H "Accept: application/vnd.github.raw" \
            | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer).get(sys.argv[1], {}).get("version", ""))' "$ID")
          if [ -z "$registered" ]; then
            echo "::notice::$ZED_REGISTRY has no entry for $ID yet; submit it by hand (docs/releasing.md)"
            exit 0
          fi
          if [ "$registered" = "$VERSION" ]; then
            echo "$ZED_REGISTRY already has $ID $VERSION"
            exit 0
          fi
          if [ -n "$(gh pr list --repo "$ZED_REGISTRY" --head "$branch" --state open --json url --jq '.[].url')" ]; then
            echo "$ZED_REGISTRY already has an open pull request for $ID $VERSION"
            exit 0
          fi
          gh repo sync "$ZED_REGISTRY_FORK" --source "$ZED_REGISTRY"
          git clone --depth 1 --filter=blob:none "https://x-access-token:$GH_TOKEN@github.com/$ZED_REGISTRY_FORK.git" registry
          cd registry
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$COMMIT,extensions/$ID"
          python3 - "$ID" "$VERSION" <<'PY'
          import re, sys
          extension, version = sys.argv[1:]
          with open("extensions.toml") as f:
              text = f.read()
          section = re.compile(rf'(^\[{re.escape(extension)}\]\n(?:(?!\[).*\n)*?version = )"[^"]*"', re.M)
          text, count = section.subn(rf'\g<1>"{version}"', text)
          if count != 1:
              sys.exit(f"extensions.toml: no version for [{extension}]")
          with open("extensions.toml", "w") as f:
              f.write(text)
          PY
          git add extensions.toml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "Update $ID to $VERSION"
          git push origin "$branch"
          gh pr create --repo "$ZED_REGISTRY" --head "${ZED_REGISTRY_FORK%%/*}:$branch" \
            --title "Update $ID to $VERSION" \
            --body "Updates Heritage Themes to $VERSION: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: zed
          path: build/heritage-themes-zed-${{ env.VERSION }}.zip
          if-no-files-found: error

  nvim:
    needs: check
    if: needs.check.outputs.nvim == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # Neovim's plugin managers install from this repository, which holds the plugin at its root (docs/releasing.md).
      NVIM_REPOSITORY: heritage-themes/heritage-themes.nvim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check release secrets
        shell: bash
        env:
          NVIM_REPO_TOKEN: ${{ secrets.NVIM_REPO_TOKEN }}
        run: |
          if [ -z "$NVIM_REPO_TOKEN" ]; then
            echo "::error::Repository secret NVIM_REPO_TOKEN is empty or not set"
            exit 1
          fi

      - run: python3 build.py

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NVIM_REPOSITORY }}
          token: ${{ secrets.NVIM_REPO_TOKEN }}
          path: nvim-repository
          fetch-depth: 0

      # Plugin managers read the tags: lazy.nvim's version = "*" and vim.pack's version ranges need v<semver>.
      - name: Publish to the Neovim plugin repository
        shell: bash
        run: |
          cd nvim-repository
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "$NVIM_REPOSITORY is already tagged v$VERSION"
            exit 0
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../build/nvim/. .
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --message "Release $VERSION" \
              --message "Generated from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          fi
          git tag "v$VERSION"
          git push origin HEAD "refs/tags/v$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: nvim
          path: build/heritage-themes-nvim-${{ env.VERSION }}.zip
          if-no-files-found: error

  # Notepad++ has no theme registry: users install the theme files from the zip that the GitHub release
  # attaches (docs/releasing.md).
  notepadpp:
    needs: check
    if: needs.check.outputs.notepadpp == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: python3 build.py

      - uses: actions/upload-artifact@v7
        with:
          name: notepadpp
          path: build/heritage-themes-notepadpp-${{ env.VERSION }}.zip
          if-no-files-found: error

  release:
    needs: [check, jetbrains, vscode, sublime, zed, nvim, notepadpp]
    # Runs once each product has either published or been left out of the release.
    if: >-
      ${{ !cancelled() && needs.check.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.jetbrains.result)
      && contains(fromJSON('["success", "skipped"]'), needs.vscode.result)
      && contains(fromJSON('["success", "skipped"]'), needs.sublime.result)
      && contains(fromJSON('["success", "skipped"]'), needs.zed.result)
      && contains(fromJSON('["success", "skipped"]'), needs.nvim.result)
      && contains(fromJSON('["success", "skipped"]'), needs.notepadpp.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      JETBRAINS: ${{ needs.check.outputs.jetbrains }}
      VSCODE: ${{ needs.check.outputs.vscode }}
      SUBLIME: ${{ needs.check.outputs.sublime }}
      ZED: ${{ needs.check.outputs.zed }}
      NVIM: ${{ needs.check.outputs.nvim }}
      NOTEPADPP: ${{ needs.check.outputs.notepadpp }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prints the changelog section for a version.
          section() {
            awk -v v="$2" '
              $0 ~ "^## \\[" v "\\]" {on = 1; next}
              /^## \[/ {on = 0}
              on' "$1"
          }
          # Downloads the files matching the patterns from the newest release that carries the
          # first one, so a product left out of this release ships the build of its last release.
          attach() {
            local tags
            tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(any(.assets[]; .name == \"$1\")) | .tag_name")
            if [ -z "$tags" ]; then
              echo "::error::No GitHub release carries $1"
              exit 1
            fi
            local pattern patterns=()
            for pattern in "$@"; do patterns+=(--pattern "$pattern"); done
            gh release download "${tags%%$'\n'*}" --repo "$GITHUB_REPOSITORY" "${patterns[@]}" --dir dist
          }
          # Writes a product's part of the release notes and attaches its last build if it is left out.
          notes() {
            local title=$1 included=$2 changelog=$3 file=$4
            shift 4
            echo "## $title"
            if [ "$included" = true ]; then
              section "$changelog" "$VERSION"
            else
              local previous
              previous=$(sed -n '/^## \[[0-9]/{s/^## \[\([^]]*\)\].*/\1/p;q}' "$changelog")
              echo
              echo "No changes. The attached build is version $previous."
              echo
              attach "${file/<version>/$previous}" "$@" >&2
            fi
          }
          {
            notes "JetBrains plugin" "$JETBRAINS" CHANGELOG.md "heritage-themes-<version>-signed.zip" '*.icls'
            notes "VS Code extension" "$VSCODE" vscode/CHANGELOG.md "heritage-themes-vscode-<version>.vsix"
            notes "Sublime Text package" "$SUBLIME" sublime/CHANGELOG.md "heritage-themes-sublime-<version>.sublime-package"
            notes "Zed extension" "$ZED" zed/CHANGELOG.md "heritage-themes-zed-<version>.zip"
            notes "Neovim plugin" "$NVIM" nvim/CHANGELOG.md "heritage-themes-nvim-<version>.zip"
            notes "Notepad++ themes" "$NOTEPADPP" notepadpp/CHANGELOG.md "heritage-themes-notepadpp-<version>.zip"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*
