  # Publishes the wheel to PyPI, where pip installs it from, and attaches it in a zip to the GitHub release. The build
  # compiles the extension with the builder pinned in scripts/jupyterlab, which needs Node.js.
  jupyterlab:
    needs: check
    if: needs.check.outputs.jupyterlab == 'true'
    runs-on: ubuntu-latest
    # PyPI's trusted publisher names this environment.
    environment: pypi
    permissions:
      contents: read
      id-token: write # sign in to PyPI through trusted publishing
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: python3 build.py --jupyterlab

      # The action uploads every file in its folder, and build/jupyterlab also holds the README and the licence.
      - name: Collect the wheel
        run: mkdir pypi && cp build/jupyterlab/*.whl pypi/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi
          # A re-run of a failed release must not fail on the version that this job already uploaded.
          skip-existing: true

      - uses: actions/upload-artifact@v7
        with:
          name: jupyterlab
          path: build/heritage-themes-jupyterlab-${{ env.VERSION }}.zip
          if-no-files-found: error

  # Publishes the wheel to PyPI, where pip installs it from, and attaches it in a zip to the GitHub release. The wheel
  # is pure Python, so the build needs nothing but Python.
  pygments:
    needs: check
    if: needs.check.outputs.pygments == 'true'
    runs-on: ubuntu-latest
    # PyPI's trusted publisher names this environment.
    environment: pypi
    permissions:
