name: Publish

# Fires only when a version tag (for example `v1.0.0`) is pushed, so the tag push is the release
# gate. The tag is pushed after Build has passed on the commit it points at.
# Publishes each product whose changelog has a section for the version, then creates one GitHub
# release that carries every product: a product left out keeps the build of its last release.
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      jetbrains: ${{ steps.check.outputs.jetbrains }}
      vscode: ${{ steps.check.outputs.vscode }}
      visualstudio: ${{ steps.check.outputs.visualstudio }}
      sublime: ${{ steps.check.outputs.sublime }}
      zed: ${{ steps.check.outputs.zed }}
      nvim: ${{ steps.check.outputs.nvim }}
      notepadpp: ${{ steps.check.outputs.notepadpp }}
      xcode: ${{ steps.check.outputs.xcode }}
      helix: ${{ steps.check.outputs.helix }}
      kakoune: ${{ steps.check.outputs.kakoune }}
      micro: ${{ steps.check.outputs.micro }}
      vim: ${{ steps.check.outputs.vim }}
      emacs: ${{ steps.check.outputs.emacs }}
      terminals: ${{ steps.check.outputs.terminals }}
      nano: ${{ steps.check.outputs.nano }}
      textadept: ${{ steps.check.outputs.textadept }}
      lapce: ${{ steps.check.outputs.lapce }}
      qtcreator: ${{ steps.check.outputs.qtcreator }}
      amp: ${{ steps.check.outputs.amp }}
      eclipse: ${{ steps.check.outputs.eclipse }}
      nova: ${{ steps.check.outputs.nova }}
      jupyterlab: ${{ steps.check.outputs.jupyterlab }}
      pygments: ${{ steps.check.outputs.pygments }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        id: check
        shell: bash
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' build.py)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $version in build.py"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on master"
            exit 1
          fi
          jetbrains=false vscode=false visualstudio=false sublime=false zed=false nvim=false notepadpp=false xcode=false helix=false \
            kakoune=false micro=false vim=false emacs=false terminals=false nano=false textadept=false lapce=false \
            qtcreator=false amp=false eclipse=false nova=false jupyterlab=false pygments=false
          grep -q "^## \[$version\]" CHANGELOG.md && jetbrains=true
          grep -q "^## \[$version\]" vscode/CHANGELOG.md && vscode=true
          grep -q "^## \[$version\]" visualstudio/CHANGELOG.md && visualstudio=true
          grep -q "^## \[$version\]" sublime/CHANGELOG.md && sublime=true
          grep -q "^## \[$version\]" zed/CHANGELOG.md && zed=true
          grep -q "^## \[$version\]" nvim/CHANGELOG.md && nvim=true
          grep -q "^## \[$version\]" notepadpp/CHANGELOG.md && notepadpp=true
          grep -q "^## \[$version\]" xcode/CHANGELOG.md && xcode=true
          grep -q "^## \[$version\]" helix/CHANGELOG.md && helix=true
          grep -q "^## \[$version\]" kakoune/CHANGELOG.md && kakoune=true
          grep -q "^## \[$version\]" micro/CHANGELOG.md && micro=true
          grep -q "^## \[$version\]" vim/CHANGELOG.md && vim=true
          grep -q "^## \[$version\]" emacs/CHANGELOG.md && emacs=true
          grep -q "^## \[$version\]" terminals/CHANGELOG.md && terminals=true
          grep -q "^## \[$version\]" nano/CHANGELOG.md && nano=true
          grep -q "^## \[$version\]" textadept/CHANGELOG.md && textadept=true
          grep -q "^## \[$version\]" lapce/CHANGELOG.md && lapce=true
          grep -q "^## \[$version\]" qtcreator/CHANGELOG.md && qtcreator=true
          grep -q "^## \[$version\]" amp/CHANGELOG.md && amp=true
          grep -q "^## \[$version\]" eclipse/CHANGELOG.md && eclipse=true
          grep -q "^## \[$version\]" nova/CHANGELOG.md && nova=true
          grep -q "^## \[$version\]" jupyterlab/CHANGELOG.md && jupyterlab=true
          grep -q "^## \[$version\]" pygments/CHANGELOG.md && pygments=true
          if [ "$jetbrains" = false ] && [ "$vscode" = false ] && [ "$visualstudio" = false ] && [ "$sublime" = false ] \
              && [ "$zed" = false ] && [ "$nvim" = false ] && [ "$notepadpp" = false ] && [ "$xcode" = false ] \
              && [ "$helix" = false ] && [ "$kakoune" = false ] && [ "$micro" = false ] && [ "$vim" = false ] \
              && [ "$emacs" = false ] && [ "$terminals" = false ] && [ "$nano" = false ] && [ "$textadept" = false ] \
              && [ "$lapce" = false ] && [ "$qtcreator" = false ] && [ "$amp" = false ] \
              && [ "$eclipse" = false ] && [ "$nova" = false ] && [ "$jupyterlab" = false ] \
              && [ "$pygments" = false ]; then
            echo "::error::No product changelog has a [$version] section"
            exit 1
          fi
          {
            echo "version=$version"
            echo "jetbrains=$jetbrains"
            echo "vscode=$vscode"
            echo "visualstudio=$visualstudio"
            echo "sublime=$sublime"
            echo "zed=$zed"
            echo "nvim=$nvim"
            echo "notepadpp=$notepadpp"
            echo "xcode=$xcode"
            echo "helix=$helix"
            echo "kakoune=$kakoune"
            echo "micro=$micro"
            echo "vim=$vim"
            echo "emacs=$emacs"
            echo "terminals=$terminals"
            echo "nano=$nano"
            echo "textadept=$textadept"
            echo "lapce=$lapce"
            echo "qtcreator=$qtcreator"
            echo "amp=$amp"
            echo "eclipse=$eclipse"
            echo "nova=$nova"
            echo "jupyterlab=$jupyterlab"
            echo "pygments=$pygments"
          } >> "$GITHUB_OUTPUT"

  jetbrains:
    needs: check
    if: needs.check.outputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # JetBrains marketplace-zip-signer CLI, pinned with the SHA-256 of the jar from Maven Central.
      SIGNER_VERSION: 0.1.43
      SIGNER_SHA256: 2958a0f42221d6062b50f22754e413ae5cc42f60c441467202c6700df2e22f44
      PLUGIN_XML_ID: heritage.themes
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The signer exits successfully on an empty certificate or key and the upload would then
      # carry an unsigned archive. Fail before either runs.
      - name: Check release secrets
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          missing=0
          for name in CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD PUBLISH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"

      - run: python3 build.py

      - name: Sign the plugin
        shell: bash
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          signer="$RUNNER_TEMP/marketplace-zip-signer-cli.jar"
          curl --fail --silent --show-error --location --output "$signer" \
            "https://repo1.maven.org/maven2/org/jetbrains/marketplace-zip-signer/$SIGNER_VERSION/marketplace-zip-signer-$SIGNER_VERSION-cli.jar"
          echo "$SIGNER_SHA256  $signer" | sha256sum --check -
          umask 077
          printf '%s\n' "$CERTIFICATE_CHAIN" > "$RUNNER_TEMP/chain.crt"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/private.pem"
          java -jar "$signer" sign \
            -in "build/heritage-themes-$VERSION.zip" \
            -out "build/heritage-themes-$VERSION-signed.zip" \
            -cert-file "$RUNNER_TEMP/chain.crt" \
            -key-file "$RUNNER_TEMP/private.pem" \
            -key-pass "$PRIVATE_KEY_PASSWORD"
          java -jar "$signer" verify \
            -in "build/heritage-themes-$VERSION-signed.zip" \
            -cert "$RUNNER_TEMP/chain.crt"
          rm -f "$RUNNER_TEMP/chain.crt" "$RUNNER_TEMP/private.pem"

      # Uploads a new version of a plugin that already exists on the Marketplace. The first
      # version is uploaded by hand.
      - name: Publish to JetBrains Marketplace
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $PUBLISH_TOKEN" \
            --form "xmlId=$PLUGIN_XML_ID" \
            --form "file=@build/heritage-themes-$VERSION-signed.zip" \
            https://plugins.jetbrains.com/plugin/uploadPlugin

      - name: Collect the release files
        run: mkdir dist && cp "build/heritage-themes-$VERSION-signed.zip" build/schemes/*.icls dist/

      - uses: actions/upload-artifact@v7
        with:
          name: jetbrains
          path: dist/
          if-no-files-found: error

  vscode:
    needs: check
    if: needs.check.outputs.vscode == 'true'
    runs-on: ubuntu-latest
    # The Entra ID federated credential trusts this environment.
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write # sign in to Microsoft Entra ID and to Open VSX through trusted publishing
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check release settings
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"

      - run: python3 build.py --vsix

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the VS Marketplace
        run: scripts/vscode/node_modules/.bin/vsce publish --azure-credential --packagePath "build/heritage-themes-vscode-$VERSION.vsix"

      - name: Publish to Open VSX
        run: scripts/vscode/node_modules/.bin/ovsx publish --trusted-publishing "build/heritage-themes-vscode-$VERSION.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: vscode
          path: build/heritage-themes-vscode-${{ env.VERSION }}.vsix
          if-no-files-found: error

  # VsixPublisher, the Marketplace's tool for Visual Studio extensions, runs on Windows. It signs in with a Microsoft
  # Entra ID token of the identity that publishes the VS Code extension, passed where it takes a personal access
  # token.
  visualstudio:
    needs: check
    if: needs.check.outputs.visualstudio == 'true'
    runs-on: windows-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write # sign in to Microsoft Entra ID
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # VsixPublisher from the Visual Studio SDK build tools, pinned with the SHA-256 of the package from NuGet.
      VSSDK_VERSION: 18.9.820
      VSSDK_SHA256: adb94ec5cf730264bec92fa2f2a6fbf3abe455fbe27f3e7737b9df0176bb1e7a
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check release settings
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"

      - run: python build.py

      - name: Get VsixPublisher
        shell: bash
        run: |
          package="$RUNNER_TEMP/vssdk.nupkg"
          curl --fail --silent --show-error --location --output "$package" \
            "https://api.nuget.org/v3-flatcontainer/microsoft.vssdk.buildtools/$VSSDK_VERSION/microsoft.vssdk.buildtools.$VSSDK_VERSION.nupkg"
          echo "$VSSDK_SHA256  $package" | sha256sum --check -
          # The whole package: the unzip of Git for Windows does not match a wildcard across folders, so
          # tools/vssdk/bin/* would leave out bin/lib, which holds the assemblies VsixPublisher loads.
          unzip -q "$package" -d "$RUNNER_TEMP/vssdk"
          "$RUNNER_TEMP/vssdk/tools/vssdk/bin/VsixPublisher.exe" version
          echo "VSIX_PUBLISHER=$RUNNER_TEMP/vssdk/tools/vssdk/bin/VsixPublisher.exe" >> "$GITHUB_ENV"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # 499b84ac-1321-427f-aa17-267ca6975798 is Azure DevOps, which the Marketplace signs in through.
      - name: Publish to the VS Marketplace
        shell: bash
        run: |
          token=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken --output tsv)
          echo "::add-mask::$token"
          "$VSIX_PUBLISHER" login -personalAccessToken "$token" -publisherName heritage-themes -overwrite
          "$VSIX_PUBLISHER" publish -payload "build/heritage-themes-visualstudio-$VERSION.vsix" \
            -publishManifest build/visualstudio-marketplace/publishManifest.json
          "$VSIX_PUBLISHER" logout -publisherName heritage-themes

      - uses: actions/upload-artifact@v7
        with:
          name: visualstudio
          path: build/heritage-themes-visualstudio-${{ env.VERSION }}.vsix
          if-no-files-found: error

  sublime:
    needs: check
    if: needs.check.outputs.sublime == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # Package Control installs from this repository, which holds the package at its root.
      SUBLIME_REPOSITORY: heritage-themes/heritage-themes-sublime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check release secrets
        shell: bash
        env:
          SUBLIME_REPO_TOKEN: ${{ secrets.SUBLIME_REPO_TOKEN }}
        run: |
          if [ -z "$SUBLIME_REPO_TOKEN" ]; then
            echo "::error::Repository secret SUBLIME_REPO_TOKEN is empty or not set"
            exit 1
          fi

      - run: python3 build.py

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SUBLIME_REPOSITORY }}
          token: ${{ secrets.SUBLIME_REPO_TOKEN }}
          path: sublime-repository
          fetch-depth: 0

      # Package Control reads the tag, which is the plain version: it needs a semantic version.
      - name: Publish to the Sublime Text package repository
        shell: bash
        run: |
          cd sublime-repository
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "$SUBLIME_REPOSITORY is already tagged $VERSION"
            exit 0
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../build/sublime/. .
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --message "Release $VERSION" \
              --message "Generated from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          fi
          git tag "$VERSION"
          git push origin HEAD "refs/tags/$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: sublime
          path: build/heritage-themes-sublime-${{ env.VERSION }}.sublime-package
          if-no-files-found: error

  zed:
    needs: check
    if: needs.check.outputs.zed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # Zed's extension registry installs from this repository, which holds the extension at its root.
      ZED_REPOSITORY: heritage-themes/heritage-themes-zed
      # The registry, and the fork that the pull request updating it comes from.
      ZED_REGISTRY: zed-industries/extensions
      ZED_REGISTRY_FORK: heritage-themes/extensions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check release secrets
        shell: bash
        env:
          ZED_REPO_TOKEN: ${{ secrets.ZED_REPO_TOKEN }}
          ZED_REGISTRY_TOKEN: ${{ secrets.ZED_REGISTRY_TOKEN }}
        run: |
          for name in ZED_REPO_TOKEN ZED_REGISTRY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is empty or not set"
              exit 1
            fi
          done

      - run: python3 build.py

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ZED_REPOSITORY }}
          token: ${{ secrets.ZED_REPO_TOKEN }}
          path: zed-repository
          fetch-depth: 0

      - name: Publish to the Zed extension repository
        id: repository
        shell: bash
        run: |
          cd zed-repository
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -r ../build/zed/. .
            git add --all
            if ! git diff --cached --quiet; then
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit --message "Release $VERSION" \
                --message "Generated from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            fi
            git tag "v$VERSION"
            git push origin HEAD "refs/tags/v$VERSION"
          fi
          echo "commit=$(git rev-parse "refs/tags/v$VERSION^{commit}")" >> "$GITHUB_OUTPUT"

      # The registry pins each extension as a submodule with its version in extensions.toml; a pull
      # request that moves both publishes the release once Zed's maintainers merge it.
      - name: Open the Zed extension registry pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ZED_REGISTRY_TOKEN }}
          COMMIT: ${{ steps.repository.outputs.commit }}
          ID: heritage-theme
        run: |
          branch="$ID-$VERSION"
          registered=$(gh api "repos/$ZED_REGISTRY/contents/extensions.toml" -H "Accept: application/vnd.github.raw" \
            | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer).get(sys.argv[1], {}).get("version", ""))' "$ID")
          if [ -z "$registered" ]; then
            echo "::notice::$ZED_REGISTRY has no entry for $ID yet; submit it by hand"
            exit 0
          fi
          if [ "$registered" = "$VERSION" ]; then
            echo "$ZED_REGISTRY already has $ID $VERSION"
            exit 0
          fi
          if [ -n "$(gh pr list --repo "$ZED_REGISTRY" --head "$branch" --state open --json url --jq '.[].url')" ]; then
            echo "$ZED_REGISTRY already has an open pull request for $ID $VERSION"
            exit 0
          fi
          gh repo sync "$ZED_REGISTRY_FORK" --source "$ZED_REGISTRY"
          git clone --depth 1 --filter=blob:none "https://x-access-token:$GH_TOKEN@github.com/$ZED_REGISTRY_FORK.git" registry
          cd registry
          git switch -c "$branch"
          git update-index --cacheinfo "160000,$COMMIT,extensions/$ID"
          python3 - "$ID" "$VERSION" <<'PY'
          import re, sys
          extension, version = sys.argv[1:]
          with open("extensions.toml") as f:
              text = f.read()
          section = re.compile(rf'(^\[{re.escape(extension)}\]\n(?:(?!\[).*\n)*?version = )"[^"]*"', re.M)
          text, count = section.subn(rf'\g<1>"{version}"', text)
          if count != 1:
              sys.exit(f"extensions.toml: no version for [{extension}]")
          with open("extensions.toml", "w") as f:
              f.write(text)
          PY
          git add extensions.toml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "Update $ID to $VERSION"
          git push origin "$branch"
          gh pr create --repo "$ZED_REGISTRY" --head "${ZED_REGISTRY_FORK%%/*}:$branch" \
            --title "Update $ID to $VERSION" \
            --body "Updates Heritage Themes to $VERSION: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: zed
          path: build/heritage-themes-zed-${{ env.VERSION }}.zip
          if-no-files-found: error

  nvim:
    needs: check
    if: needs.check.outputs.nvim == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # Neovim's plugin managers install from this repository, which holds the plugin at its root.
      NVIM_REPOSITORY: heritage-themes/heritage-themes.nvim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check release secrets
        shell: bash
        env:
          NVIM_REPO_TOKEN: ${{ secrets.NVIM_REPO_TOKEN }}
        run: |
          if [ -z "$NVIM_REPO_TOKEN" ]; then
            echo "::error::Repository secret NVIM_REPO_TOKEN is empty or not set"
            exit 1
          fi

      - run: python3 build.py

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.NVIM_REPOSITORY }}
          token: ${{ secrets.NVIM_REPO_TOKEN }}
          path: nvim-repository
          fetch-depth: 0

      # Plugin managers read the tags: lazy.nvim's version = "*" and vim.pack's version ranges need v<semver>.
      - name: Publish to the Neovim plugin repository
        shell: bash
        run: |
          cd nvim-repository
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "$NVIM_REPOSITORY is already tagged v$VERSION"
            exit 0
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../build/nvim/. .
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --message "Release $VERSION" \
              --message "Generated from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          fi
          git tag "v$VERSION"
          git push origin HEAD "refs/tags/v$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: nvim
          path: build/heritage-themes-nvim-${{ env.VERSION }}.zip
          if-no-files-found: error

  # Notepad++ has no theme registry: users install the theme files from the zip that the GitHub release
  # attaches.
  notepadpp:
    needs: check
    if: needs.check.outputs.notepadpp == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: python3 build.py

