name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # build.py is pure standard-library Python that writes the same bytes on every OS, and it
    # validates the plugin descriptor, theme files and icons itself, so one Linux runner is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 build.py
