name: Publish VS Code

# Fires only when a VS Code version tag (for example `vscode-v1.0.0`) is pushed, so the tag push is the
# release gate. scripts/release.sh --vscode pushes the tag after Build has passed on the commit it points at.
on:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: read

concurrency:
  group: publish-vscode
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The Entra ID federated credential trusts this environment (docs/releasing.md).
    environment: vscode-marketplace
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign in to Microsoft Entra ID for the VS Marketplace
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the tag
        shell: bash
        run: |
          version=$(sed -n 's/^VSCODE_VERSION = "\(.*\)"/\1/p' build.py)
          if [ "$GITHUB_REF_NAME" != "vscode-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VSCODE_VERSION $version in build.py"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on master"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" vscode/CHANGELOG.md; then
            echo "::error::vscode/CHANGELOG.md has no [$version] section"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check release settings
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID OVSX_PAT; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"

      - run: python3 build.py --vsix

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to the VS Marketplace
        run: scripts/vscode/node_modules/.bin/vsce publish --azure-credential --packagePath "build/heritage-themes-vscode-$VERSION.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: scripts/vscode/node_modules/.bin/ovsx publish "build/heritage-themes-vscode-$VERSION.vsix"

      # The JetBrains release stays marked as the latest, since the jar is the download the README points to.
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on = 1; next}
            /^## \[/ {on = 0}
            on' vscode/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "VS Code $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false \
            "build/heritage-themes-vscode-$VERSION.vsix"
